name: Executar Scraper Automatico

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install requests beautifulsoup4

      - name: Executar Scraper dos Portais
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper.py

      - name: Salvar Dados Atualizados no GitHub
        run: |
          git config --global user.name "Bot Automático"
          git config --global user.email "bot@exemplo.com"
          git add dados_imoveis.json
          git commit -m "Atualizando base de imóveis reais" || exit 0
          git push
