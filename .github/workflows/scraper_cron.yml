name: Executar Scraper Automatico

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Scraper dos Portais
        run: python scraper.py

      - name: Salvar Dados Atualizados no GitHub
        run: |
          git config --global user.name "Bot Scraper"
          git config --global user.email "bot@flippingba.com"
          git add dados_imoveis.json
          git commit -m "Atualização automática de ofertas de imóveis" || exit 0
          git push
